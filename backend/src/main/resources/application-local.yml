# application-local.yml
server:
  port: 8080

parser:
  api:
    url: http://localhost:8001

spring:
  datasource:
    riding:
      url: jdbc:mariadb://34.172.162.148:3306/riding_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}

      driver-class-name: org.mariadb.jdbc.Driver

      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 963024529670-769djp6j8pv6hn2eetaci3nveaq7f10p.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET} # 끝에 's' 제거
            scope:
              - https://www.googleapis.com/auth/fitness.nutrition.read
              - https://www.googleapis.com/auth/fitness.body.read
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo # 끝에 'o' 추가

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

inbody:
  upload:
    path: /tmp/inbody/raw/

exercise:
  gif:
    path: /tmp/exercise-gifs/   # 로컬은 안 씀
    base-url: /gif/   # → /gif/CHEST_PRESS.gif (public 폴더)

anthropic:
  # .env(backend/src/main/resources/.env)의 CLAUDE_KEY 사용. spring-dotenv 가 로드.
  api-key: ${CLAUDE_KEY:}

google:
  fitness:
    api-url: https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate

lotto:
  datasource:
    enabled: false

brevet:
  nas-path: ${BREVET_NAS_PATH:}

windy:
  api-key: ${WINDY_API_KEY:}
  api-url: https://api.windy.com/api/point-forecast/v2
  model: gfs  # GFS 모델 (한국 커버리지 좋음)

persona:
  blog:
    base-url: https://tho881.tistory.com
    sitemap-path: /sitemap.xml
    # 본문 셀렉터 후보(우선순위 순, 콤마 구분). 스킨 변경 시 여기만 조정.
    content-selectors: "#article-view .tt_article_useless_p_margin,.tt_article_useless_p_margin,.area_view_content,.article_view"
  # 본인이 직접 작성한 PDF 문서 자동 스캔. 클래스패스(=src/main/resources)의 templates/*.pdf 전부 로드.
  # PDF 를 src/main/resources/templates/ 아래에 두기만 하면 추가/삭제됨(코드·설정 변경 불필요).
  docs:
    location: "classpath*:templates/*.pdf"

app:
  base-url: http://localhost:5173

