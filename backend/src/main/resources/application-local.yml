# application-local.yml
server:
  port: 8080
  tomcat:
    accesslog:
      check-exists: false

parser:
  api:
    url: http://localhost:8001

spring:
  jackson:
    time-zone: Asia/Seoul

  config:
    import: optional:classpath:.env[.properties]

  datasource:
    # LifeMetrics 메인 DB (운동/건강/라이딩/페르소나)
    riding:
      url: jdbc:mariadb://localhost:3307/riding_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

    # Journal DB (같은 인스턴스, 다른 스키마)
    journal:
      url: jdbc:mariadb://localhost:3307/journal_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - https://www.googleapis.com/auth/fitness.nutrition.read
              - https://www.googleapis.com/auth/fitness.body.read
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

inbody:
  upload:
    path: /tmp/inbody/raw/

career:
  media:
    path: /tmp/career-media/

exercise:
  gif:
    path: /tmp/exercise-gifs/   # 로컬은 안 씀
    base-url: /gif/             # → /gif/CHEST_PRESS.gif (public 폴더)

anthropic:
  # .env(backend/src/main/resources/.env)의 ANTHROPIC_API_KEY 사용. spring-dotenv 가 로드.
  api-key: ${ANTHROPIC_API_KEY:}

typecast:
  # Typecast TTS. 키 미설정이면 /api/tts 가 503 → 프론트는 조용히 재생 스킵(브라우저 기본동작 영향 없음).
  api-key: ${TYPECAST_API_KEY:}
  base-url: https://api.typecast.ai
  model: ssfm-v30            # 최신 모델(권장). 안정버전은 ssfm-v21
  voice:
    persona: ${TYPECAST_VOICE_PERSONA:}   # GET /v2/voices 에서 고른 tc_xxxx
    riding:  ${TYPECAST_VOICE_RIDING:}    # tc_xxxx

google:
  fitness:
    api-url: https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate

lotto:
  datasource:
    enabled: false

brevet:
  nas-path: ${BREVET_NAS_PATH:}

windy:
  api-key: ${WINDY_API_KEY:}
  api-url: https://api.windy.com/api/point-forecast/v2
  model: gfs  # GFS 모델 (한국 커버리지 좋음)

persona:
  blog:
    base-url: https://tho881.tistory.com
    sitemap-path: /sitemap.xml
    content-selectors: "#article-view .tt_article_useless_p_margin,.tt_article_useless_p_margin,.area_view_content,.article_view"
  docs:
    location: "classpath*:templates/*.pdf"

app:
  base-url: http://localhost:5173

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

settings:
  password: ${SETTINGS_PASSWORD:lifemetrics}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash   # AI Studio 모델 목록에서 현재 Flash ID 확인 후 설정

gcp:
  tts:
    language-code: ko-KR
    audio-encoding: LINEAR16          # 용량 줄이려면 MP3 (컨트롤러 Content-Type=audio/mpeg)
    voice:
      persona: ko-KR-Chirp3-HD-Kore   # 여성
      riding:  ko-KR-Chirp3-HD-Charon # 남성

vertex:
  project-id: ridingwebapplication
  location: global
  model: gemini-2.5-flash
