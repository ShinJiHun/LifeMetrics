# application-prod.yml
server:
  port: 8080
  forward-headers-strategy: native

parser:
  api:
    url: http://host.docker.internal:8001

spring:
  jackson:
    time-zone: Asia/Seoul

  datasource:
    riding:
      url: jdbc:mariadb://172.17.0.1:3306/riding_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

    journal:
      url: jdbc:mariadb://172.17.0.1:3306/journal_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

    lotto:
      url: jdbc:mariadb://172.17.0.1:3306/lotto_db
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 415261907040-90umvp9luqjtbvs5tft2jps2h126iq2h.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://ride.tho881.me/login/oauth2/code/google"
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

inbody:
  upload:
    path: /mnt/200gb/NAS/health/inbody/raw/

career:
  media:
    path: /mnt/200gb/NAS/persona/career-media/

# 인간 페르소나 - 핸들러 월별 정산서 PDF 보관 폴더 (HandlerSettlementController)
handler:
  settlement:
    path: /mnt/200gb/NAS/persona/handler-settlement/

# 인간 페르소나 - 독서 노트 파일(앱 기록) 보관 폴더 (ReadingNoteController) — uploads/ 에 저장, samples/ 는 예시 파일
reading:
  note:
    path: /mnt/200gb/NAS/persona/reading/

# 블로그 글 본문 이미지 — 글쓰기 에디터 업로드 (BlogImageController)
blog:
  image:
    path: /mnt/200gb/NAS/persona/blog-images/

# application-gcp.yml
exercise:
  gif:
    base-url: /api/exercise/gif/  # → /api/exercise/gif/CHEST_PRESS.gif (NAS 서빙)

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# 애슐리트 챗: tools = AI 가 필요한 기록을 도구로 조회(ai.tools), context = 최근 기록을 통째로 프롬프트에 넣음
athlete:
  chat:
    mode: ${ATHLETE_CHAT_MODE:tools}

typecast:
  # Typecast TTS. 키 미설정이면 /api/tts 가 503 → 프론트는 조용히 재생 스킵.
  api-key: ${TYPECAST_API_KEY:}
  base-url: https://api.typecast.ai
  model: ssfm-v30
  voice:
    persona: ${TYPECAST_VOICE_PERSONA:}
    riding:  ${TYPECAST_VOICE_RIDING:}

persona:
  blog:
    base-url: https://tho881.tistory.com
    # 블로그 글·사진 보관 폴더(data_pipeline/persona/blog_archive.py) — 활동 지도 사진(ActivityPhotoService)이 읽음
    archive-path: /mnt/200gb/NAS/persona/blog
    sitemap-path: /sitemap.xml
    content-selectors: "#article-view .tt_article_useless_p_margin,.tt_article_useless_p_margin,.area_view_content,.article_view"
  # 본인이 직접 작성한 PDF 문서 자동 스캔. 서버 디렉터리의 *.pdf 전부 로드(파일시스템 = file: 접두사).
  # PERSONA_DOCS_DIR 로 폴더만 바꾸면 되고, 그 폴더에 PDF 를 두기만 하면 추가/삭제됨.
  docs:
    location: "file:${PERSONA_DOCS_DIR:/mnt/200gb/NAS/persona/jihoon_info}/*.pdf"

brevet:
  nas-path: /mnt/200gb/NAS/riding/brevet

permanent:
  nas-path: /mnt/200gb/NAS/riding/permanent

lotto:
  datasource:
    enabled: true
  nas-path: /mnt/200gb/NAS/lotto

app:
  base-url: https://ride.tho881.me

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

settings:
  password: ${SETTINGS_PASSWORD:lifemetrics}

seoul:
  # 서울 열린데이터광장 인증키 (따릉이 대여소 좌표 동기화용)
  openapi-key: ${SEOUL_OPENAPI_KEY:}
